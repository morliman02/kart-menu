name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runner'ında Android SDK zaten kurulu (ANDROID_HOME ayarlı),
      # ayrıca bir kurulum adımına gerek yok.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Dosya adını sürüm numarasıyla ad verelim ki inen dosya eskisiyle karışmasın
      # (hep "app-debug.apk" olunca indirilenler klasöründe aynı isimle birikiyordu).
      - name: Sürümlü dosya adı oluştur
        id: rename
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Kart-Menusu-$VN.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kart-menu-debug-apk
          path: Kart-Menusu-${{ steps.rename.outputs.version }}.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rename.outputs.version }}-${{ github.run_number }}
          name: Kart Menüsü ${{ steps.rename.outputs.version }}
          body: |
            Kart Menüsü sürüm ${{ steps.rename.outputs.version }} kurulum dosyası.
            Aşağıdaki **Kart-Menusu-${{ steps.rename.outputs.version }}.apk** dosyasına dokunup kur.
            Kurduktan sonra uygulamanın ana ekranında "Sürüm ${{ steps.rename.outputs.version }}" yazdığını gör.
            Kurarken telefon "bilinmeyen kaynak" izni isterse izin ver.
          files: Kart-Menusu-${{ steps.rename.outputs.version }}.apk
